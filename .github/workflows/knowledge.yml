name: Knowledge base

on:
  push:
  pull_request:
  workflow_dispatch:  # started by review-signoff.yml for the pull requests it opens

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Check articles, search and tests
        run: python -m tools.check
      - name: Build database
        run: python -m tools.build_kb --quiet
      - name: Benchmark
        run: python -m evaluation.run_benchmark --failures
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-db
          path: build/knowledge.db
      - name: Review pack builds (published by review-site.yml)
        run: python -m tools.review_pack --out build/review

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          # Reuse downloaded Gradle dependencies between runs. Without this every run fetches
          # everything from Maven Central again, which rate-limits busy CI (HTTP 429).
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Unit, parity and screen tests
        working-directory: android
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify debug APK signing
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-signature.txt"
          cat "$RUNNER_TEMP/apk-signature.txt"
          grep -F "Signer #1 certificate SHA-256 digest: bb898c739a6c191e4ac4e826276cc5376b9f97eb2a460828669434c108597b6c" "$RUNNER_TEMP/apk-signature.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots/
