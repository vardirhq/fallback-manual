name: Knowledge base

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Check articles, search and tests
        run: python -m tools.check
      - name: Build database
        run: python -m tools.build_kb --quiet
      - name: Benchmark
        run: python -m evaluation.run_benchmark --failures
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-db
          path: build/knowledge.db
      - name: Review pack (offline pages for expert reviewers)
        run: python -m tools.review_pack --out build/review
      - uses: actions/upload-artifact@v4
        with:
          name: review-pack
          path: build/review/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          # Reuse downloaded Gradle dependencies between runs. Without this every run fetches
          # everything from Maven Central again, which rate-limits busy CI (HTTP 429).
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Unit, parity and screen tests
        working-directory: android
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots/
