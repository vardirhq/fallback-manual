name: Review site

# Publishes the review pack (python -m tools.review_pack) to GitHub Pages, so expert reviewers can
# open articles from a link. Rebuilt on every push to main, so it always shows the current text.
# Every page carries a noindex tag and a draft banner: they are unreviewed drafts.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Build the review pack
        env:
          # Optional repository variable: where "Send review by email" sends sign-offs.
          REVIEW_EMAIL: ${{ vars.REVIEW_EMAIL }}
        run: python -m tools.review_pack --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
