# Categories in the order the app shows them. Article folders must use one of these ids.
# code: the 2-letter prefix of article codes (e.g. FA-02). Never change a code once used.
# icon: a name from icons.yaml.
# titles: the title in other languages (see LANGUAGES in tools/build_kb.py).
categories:
  - {id: first-aid, title: First aid, code: FA, icon: cross, titles: {nb: Førstehjelp}}
  - {id: water, title: Water, code: WA, icon: water, titles: {nb: Vann}}
  - {id: fire-warmth, title: Fire and warmth, code: FW, icon: flame, titles: {nb: Brann og varme}}
  - {id: shelter, title: Shelter, code: SH, icon: house, titles: {nb: Ly}}
  - {id: food, title: Food, code: FO, icon: food, titles: {nb: Mat}}
  - {id: navigation-signaling, title: Navigation and signaling, code: NS, icon: compass, titles: {nb: Navigasjon og signaler}}
  - {id: electricity, title: Electricity, code: EL, icon: bolt, titles: {nb: Strøm}}
  - {id: sanitation, title: Sanitation, code: SA, icon: soap, titles: {nb: Hygiene}}
  - {id: repairs, title: Repairs, code: RE, icon: wrench, titles: {nb: Reparasjoner}}
  - {id: preparedness, title: Preparedness, code: PR, icon: checklist, titles: {nb: Beredskap}}
