# Retrieval benchmark.
#
# expect: the article ids that count as a correct answer. Empty list = the library has no
#         article for this, and the correct behaviour is to say "no match".
# set:    dev      = may be used to tune search, synonyms and thresholds
#         heldout  = never tune against these; they measure how well tuning generalises
#
# Caveat: these were written by the same author as the articles. The proposal calls for
# questions written by people who have not seen the articles; replace or extend these
# with such questions as soon as possible.

